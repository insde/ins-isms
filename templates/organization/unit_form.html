<form method="post" action="{{ action_url }}" hx-post="{{ action_url }}" hx-target="#drawer-body" class="stack-md">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="form-group">
    <label class="form-label" for="unit_name">Name der Einheit</label>
    <input class="input" id="unit_name" name="name" type="text" required maxlength="150" value="{{ name }}">
  </div>
  <div class="form-group">
    <label class="form-label" for="parent_id">Übergeordnete Einheit</label>
    <select class="select" id="parent_id" name="parent_id">
      <option value="">– Keine (Top-Level) –</option>
      {% for u in units %}
      <option value="{{ u.id }}" {% if u.id.to_string() == selected_parent_id %}selected{% endif %}>{{ u.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label" for="lead_user_id">Leitung</label>
    <select class="select" id="lead_user_id" name="lead_user_id">
      <option value="">– Nicht zugewiesen –</option>
      {% for usr in users %}
      <option value="{{ usr.id }}" {% if usr.id.to_string() == selected_lead_id %}selected{% endif %}>{{ usr.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
  </div>
</form>
